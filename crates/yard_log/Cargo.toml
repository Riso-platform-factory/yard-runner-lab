[package]
name = "yard_log"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_log.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production.
dev = ["yard_product/dev"]

[dependencies]
gpui.workspace = true
yard_product.workspace = true
zlog.workspace = true
log.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Linux turns this on through calloop; the tests turn it on everywhere.
tracing = { workspace = true, features = ["log"] }
