[package]
name = "yard_update"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_update.rs"

[features]
default = ["dev"]
dev = [
    "yard_product/dev",
    "yard_shell/dev",
    "yard_ui/dev",
]

[dependencies]
gpui = { workspace = true }
yard_product = { workspace = true, default-features = false }
yard_shell = { workspace = true, default-features = false }
http_client = { workspace = true }
tracing = { workspace = true }

# The check and the install run only on macOS yet.
[target.'cfg(target_os = "macos")'.dependencies]
yard_ui = { workspace = true, default-features = false }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
futures = { workspace = true }
log = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
yard_ui = { workspace = true, default-features = false }
futures = { workspace = true }
