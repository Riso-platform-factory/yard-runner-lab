[package]
name = "yard_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_ui.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production.
dev = ["yard_settings/dev"]

[dependencies]
yard_settings = { workspace = true, default-features = false }
gpui.workspace = true
theme.workspace = true
ui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true

# `RtlGetVersion`, for the font of the caption buttons.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_SystemInformation"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple.workspace = true
