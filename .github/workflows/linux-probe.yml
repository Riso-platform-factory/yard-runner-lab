# Lab probe, not part of YARD: what happens to YARD on Linux today.
name: linux-probe
on:
  push:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      YARD_HOME: /tmp/yard-home
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Zed's script/linux, GPUI's share)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc g++ clang lld cmake pkg-config libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libvulkan1 mesa-vulkan-drivers libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev libstdc++-12-dev xvfb imagemagick xdotool x11-utils openbox xcompmgr xserver-xorg-video-dummy xserver-xorg-core desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the production app
        id: build
        continue-on-error: true
        run: cargo build -p yard --no-default-features 2>&1 | tee build.log
      - name: Check the whole workspace
        id: check
        continue-on-error: true
        run: cargo check --workspace --all-targets 2>&1 | tee check.log
      - name: Test the workspace
        id: test
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: |
          cargo test --workspace --no-fail-fast -- --skip what_is_outside_dev_is_in_production 2>&1 | tee test.log
          for i in $(seq 20); do cargo test -p yard_update --test other_systems 2>&1 | grep "test result"; done | tee other_systems_20.log
          cargo test -p yard_log --test no_lifecycle_trace --config 'profile.dev.package.yard_log.debug-assertions=false' 2>&1 | tail -3 | tee no_lifecycle_trace.log
      - name: Run the app under Xvfb and take a screenshot
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          cat > /tmp/dummy.conf <<'CONF'
          Section "Device"
            Identifier "dummy"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Monitor"
            Identifier "monitor"
            HorizSync 5.0-1000.0
            VertRefresh 5.0-200.0
            Modeline "1280x800" 83.50 1280 1352 1480 1680 800 803 809 831
          EndSection
          Section "Screen"
            Identifier "screen"
            Device "dummy"
            Monitor "monitor"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1280x800"
            EndSubSection
          EndSection
          CONF
          sed -i 's/^          //' /tmp/dummy.conf
          sudo Xorg :99 -noreset -nolisten tcp -config /tmp/dummy.conf -logfile /tmp/xorg.log & sleep 3
          export DISPLAY=:99
          openbox & sleep 2
          xcompmgr & sleep 1
          env -u YARD_HOME YARD_LIFECYCLE=info,yard=debug target/debug/yard > app.log 2>&1 & sleep 15
          WID=$(xdotool search --classname vn.risotech.yard | head -1)
          echo "window $WID" > windows.txt
          xprop -id "$WID" WM_CLASS _NET_WM_NAME >> windows.txt 2>&1 || true
          xprop -id "$WID" -notype _NET_WM_ICON 2>&1 | head -3 >> windows.txt || true
          import -window root screenshot.png
          import -window "$WID" window.png || true
          sleep 3; import -window root screenshot-later.png
          ls -R ~/.config/yard ~/.local/share/yard > dirs.txt 2>&1 || true
          pkill -f target/debug/yard || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-probe
          path: |
            build.log
            check.log
            test.log
            app.log
            windows.txt
            dirs.txt
            other_systems_20.log
            no_lifecycle_trace.log
            screenshot.png
            window.png
            screenshot-later.png
            /tmp/xorg.log
          if-no-files-found: ignore
