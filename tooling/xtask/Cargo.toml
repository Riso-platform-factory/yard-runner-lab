[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/xtask.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production.
dev = ["yard_build_config/dev", "yard_log/dev", "yard_product/dev"]

[dependencies]
clap.workspace = true
ctrlc.workspace = true
# `ico` for the Windows installer's icon.
image = { workspace = true, features = ["ico"] }
serde_json.workspace = true
log.workspace = true
tracing.workspace = true
yard_build_config = { workspace = true, default-features = false }
yard_log = { workspace = true, default-features = false }
yard_product = { workspace = true, default-features = false }
